server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets for faster loading
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets (Vite outputs content-hashed filenames) aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # React Router handles routes like /dashboard, /jobs/123 client-side.
    # If a browser requests one of these directly (refresh, shared link),
    # nginx must still return index.html so React Router can take over —
    # otherwise it 404s since no such file physically exists.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Kubernetes health check endpoint
    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}